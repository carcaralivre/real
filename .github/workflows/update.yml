name: Update data and publish

on:
  schedule:
    - cron: "23 21 * * *" # every day at 18:23 Brasília time, after the PTAX close
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      fetched: ${{ steps.data.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch new data
        id: data
        continue-on-error: true
        run: python scripts/update.py

      - name: Commit data.json to the repository
        if: steps.data.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain docs/data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data.json
            git commit -m "Update data"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # Deploying in a separate job avoids the intermittent "No artifacts named
  # github-pages" error when deploy-pages runs right after the upload
  # (actions/deploy-pages#451).
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  report:
    needs: update
    if: needs.update.outputs.fetched == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report a failed fetch
        run: |
          echo "::error::Could not update the data; the page was published with the previous data."
          exit 1
